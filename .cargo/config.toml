# The developer override. Cargo.toml is the truth: every external is a git rev
# there, so a clean clone of kosm resolves and builds with no sibling checkouts.
# This file points those same sources back at the working trees on this machine,
# so editing phyz/tang/ipse next door still shows up in a kosm build immediately.
#
# It is committed, not gitignored, because Cam's machine is the only dev machine
# today and an uncommitted file is one more thing to lose. When a second machine
# (or CI) appears, these paths will not exist there and the right move is to
# gitignore this file and hand each developer their own — CI in particular must
# run WITHOUT it, since building from the pins is the thing being verified.
# To check what a clean clone sees, move this file aside and run cargo.
#
# A `[patch]` here overrides a `[patch]` for the same source in Cargo.toml
# (config wins, silently) and applies workspace-wide, which is what makes
# "one phyz, one tang for the whole graph" true: ipse-map pins phyz at an older
# rev and vcad/phyz pull tang from crates.io, and both are collapsed here.

[patch."https://github.com/ecto/phyz"]
phyz         = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz" }
phyz-math    = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-math" }
phyz-model   = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-model" }
phyz-rigid   = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-rigid" }
phyz-contact = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-contact" }
phyz-diff    = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-diff" }
phyz-world   = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-world" }
phyz-camera  = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-camera" }
phyz-collision = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-collision" }

[patch."https://github.com/ecto/tang"]
tang         = { path = "/Users/cam/Developer/tang/crates/tang" }
tang-3dgs    = { path = "/Users/cam/Developer/tang/crates/tang-3dgs" }
tang-tensor  = { path = "/Users/cam/Developer/tang/crates/tang-tensor" }
tang-train   = { path = "/Users/cam/Developer/tang/crates/tang-train" }

[patch."https://github.com/ecto/ipse"]
ipse-map     = { path = "/Users/cam/Developer/ipse/crates/ipse-map" }

# vcad and phyz reach tang through crates.io; the manifest sends that to the git
# rev, this sends it the rest of the way to the checkout.
[patch.crates-io]
tang      = { path = "/Users/cam/Developer/tang/crates/tang" }
tang-la   = { path = "/Users/cam/Developer/tang/crates/tang-la" }
tang-expr = { path = "/Users/cam/Developer/tang/crates/tang-expr" }
tang-ad   = { path = "/Users/cam/Developer/tang/crates/tang-ad" }
