[workspace]
resolver = "2"
members = ["crates/kosm-render", "crates/kosm-spike", "crates/kosm-view", "crates/kosm-mpm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# phyz: the clean worktree at main HEAD (the main checkout is on a feature branch).
phyz         = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz" }
phyz-math    = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-math" }
phyz-model   = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-model" }
phyz-rigid   = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-rigid" }
phyz-contact = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-contact" }
phyz-diff    = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-diff" }
phyz-world   = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-world" }
phyz-camera  = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-camera" }
vcad         = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad", default-features = false }
vcad-kernel  = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel", features = ["no-builtin-font"] }
vcad-eval    = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-eval" }
vcad-ir      = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-ir" }
phyz-collision = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-collision" }
vcad-loon    = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-loon" }
vcad-kernel-export = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel-export" }
vcad-render  = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-render", default-features = false }
vcad-kernel-acoustics = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel-acoustics" }
vcad-kernel-optics = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel-optics" }
vcad-kernel-raytrace = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel-raytrace" }
vcad-kernel-math = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel-math" }
vcad-kernel-primitives = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel-primitives" }
hound        = "3.5"
image        = { version = "0.25", default-features = false, features = ["png"] }
# The `version` is what `cargo package` embeds for a published crate; the path
# is this machine's checkout and is what every local build actually uses.
tang         = { path = "/Users/cam/Developer/tang/crates/tang", version = "0.2" }
tang-3dgs    = { path = "/Users/cam/Developer/tang/crates/tang-3dgs" }
ipse-map     = { path = "/Users/cam/Developer/ipse/crates/ipse-map" }

# One tang. vcad builds against the sibling checkout; phyz against crates.io.
# Unify on the checkout so tang::Scalar is one trait across the graph.
[patch.crates-io]
tang      = { path = "/Users/cam/Developer/tang/crates/tang" }
tang-la   = { path = "/Users/cam/Developer/tang/crates/tang-la" }
tang-expr = { path = "/Users/cam/Developer/tang/crates/tang-expr" }
tang-ad   = { path = "/Users/cam/Developer/tang/crates/tang-ad" }

# ipse-map pins phyz by git rev; point it at the same worktree everything else uses,
# or `Model` splits into two types.
[patch."https://github.com/ecto/phyz"]
phyz-math      = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-math" }
phyz-model     = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-model" }
phyz-collision = { path = "/Users/cam/Developer/phyz/.claude/worktrees/game-engine-vcad-phyz-tang-ee6b50/crates/phyz-collision" }

# vcad pulls kosm-render from this repo by git rev; without this patch cargo
# builds two copies and the Geometry impls stop lining up.
[patch."https://github.com/ecto/kosm"]
kosm-render = { path = "crates/kosm-render" }
