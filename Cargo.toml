[workspace]
resolver = "2"
members = [
    "crates/kosm-render",
    "crates/kosm",
    "crates/kosm-cli",
    "crates/kosm-registry",
    "crates/kosm-view",
    "crates/kosm-mpm",
    "crates/kosm-scan",
    "crates/kosm-train",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Cam Pedersen <cam@campedersen.com>"]
repository = "https://github.com/ecto/kosm"
# Edition 2024 needs 1.85; the highest `rust-version` anywhere in the resolved
# graph is egui/eframe 0.36's 1.95, so that is the floor kosm can honestly claim.
rust-version = "1.95"

[workspace.dependencies]
# Externals are crates.io versions: a clean clone of this repo resolves and
# builds with no sibling checkouts. Local development can still build the
# working trees — an untracked `.cargo/config.toml` (copy
# `.cargo/config.toml.example`) patches these back to local paths. The manifest
# is the truth; that file is the override.
phyz         = { version = "0.4" }
phyz-math    = { version = "0.4" }
phyz-model   = { version = "0.4" }
phyz-rigid   = { version = "0.4" }
phyz-contact = { version = "0.4" }
phyz-diff    = { version = "0.4" }
phyz-world   = { version = "0.4" }
phyz-camera  = { version = "0.4" }
phyz-collision = { version = "0.4" }
vcad         = { version = "0.10", default-features = false }
vcad-kernel  = { version = "0.10", features = ["no-builtin-font"] }
vcad-eval    = { version = "0.10" }
vcad-ir      = { version = "0.10" }
vcad-loon    = { version = "0.10" }
vcad-kernel-export = { version = "0.10" }
vcad-render  = { version = "0.10", default-features = false }
vcad-kernel-acoustics = { version = "0.10" }
vcad-kernel-optics = { version = "0.10" }
vcad-kernel-raytrace = { version = "0.10" }
vcad-kernel-math = { version = "0.10" }
vcad-kernel-primitives = { version = "0.10" }
vcad-kernel-gpu = { version = "0.10" }
hound        = "3.5"
image        = { version = "0.25", default-features = false, features = ["png"] }
tang         = { version = "0.2" }
tang-3dgs    = { version = "0.1" }
# The denoiser's training loop: `Parameter` holds the weights, `ModuleAdam` steps
# them. The convolutions themselves are ours; see `court::denoise::kpn`.
tang-tensor  = { version = "0.1" }
tang-train   = { version = "0.1" }

# One phyz, one tang, one kosm-render — every crate in the graph now resolves
# from crates.io, so no `[patch]` is needed to unify them. `crates/kosm-scan` is
# ipse-map lifted into this workspace, which is why ipse is not a dependency.

# vcad 0.10 (`vcad-kernel-gpu`, `vcad-kernel-raytrace`) depends on kosm-render
# `"0.2"` from crates.io. Without this, cargo builds that registry copy beside
# this workspace's, `Scene<G>` becomes two types, and `kosm/src/brep/mod.rs`
# stops compiling (E0308). The patch is legal now that the local version
# satisfies the requirement it replaces — it did not at 0.1.x; see commit
# b8e9cb2. `cargo publish` drops it from the packaged manifest.
[patch.crates-io]
kosm-render = { path = "crates/kosm-render" }
