[workspace]
resolver = "2"
members = [
    "crates/kosm-render",
    "crates/kosm",
    "crates/kosm-cli",
    "crates/kosm-registry",
    "crates/kosm-view",
    "crates/kosm-mpm",
    "crates/kosm-scan",
    "crates/kosm-train",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Cam Pedersen <cam@campedersen.com>"]
repository = "https://github.com/ecto/kosm"
# Edition 2024 needs 1.85; the highest `rust-version` anywhere in the resolved
# graph is egui/eframe 0.36's 1.95, so that is the floor kosm can honestly claim.
rust-version = "1.95"

[workspace.dependencies]
# Externals are git revs, not paths: a clean clone of this repo must resolve and
# build without any of Cam's sibling checkouts existing. Local development still
# builds the working trees — an untracked `.cargo/config.toml` (copy
# `.cargo/config.toml.example`) patches every one of these back to a local path.
# The manifest is the truth; that file is the override.
#
# phyz: the `v0.4.0` tag commit (fbba8ab) — the free-joint Coriolis fix, merged to
# main and published. crates.io now has phyz 0.4.0 and every subcrate (phyz-camera
# included, first publish), so each dep carries `version = "0.4"` beside the rev:
# the git tree is what builds here, the version is what `cargo package` embeds.
# The old pin (61fe0a4) was a pre-release tree still calling itself 0.3.1, which
# `version = "0.4"` correctly refuses. See docs/publishing.md.
phyz         = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
phyz-math    = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
phyz-model   = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
phyz-rigid   = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
phyz-contact = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
phyz-diff    = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
phyz-world   = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
phyz-camera  = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
phyz-collision = { git = "https://github.com/ecto/phyz", rev = "fbba8abe2d02799f5fee6a7b28b6e619083f0caf", version = "0.4" }
# vcad: `origin/main` (ecto/vcad#867 merged). This rev consumes kosm-render from
# crates.io-style by tag — `kosm-render-v0.2.0`, `version = "0.2"` — so the
# workspace no longer needs a `[patch."https://github.com/ecto/kosm"]` back-edge
# to keep one kosm-render in the graph. A rev, not a branch, so the resolve is
# reproducible and main cannot move under us. Bump deliberately, not by drift.
vcad         = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09", default-features = false }
vcad-kernel  = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09", features = ["no-builtin-font"] }
vcad-eval    = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-ir      = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-loon    = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-kernel-export = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-render  = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09", default-features = false }
vcad-kernel-acoustics = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-kernel-optics = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-kernel-raytrace = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-kernel-math = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-kernel-primitives = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
vcad-kernel-gpu = { git = "https://github.com/ecto/vcad", rev = "64e0ec4abec03eae89d26457af2d4ee0560e9f09" }
hound        = "3.5"
image        = { version = "0.25", default-features = false, features = ["png"] }
# tang: `main` HEAD. crates.io has tang 0.2.0, but eighteen commits touch
# `crates/tang` between the 0.2.0 publish (f82c629) and this rev — SIMD moments,
# the `algebraic` reduction feature, new GEMM kernels — so 0.2.0 is NOT what kosm
# builds against. The `version` is what `cargo package` would embed; the git rev is
# what every build resolves. → tang 0.2.1.
tang         = { git = "https://github.com/ecto/tang", rev = "c9ef210498e5e3e14ee69257108f8112837de913", version = "0.2" }
# not published → tang-3dgs 0.1
tang-3dgs    = { git = "https://github.com/ecto/tang", rev = "c9ef210498e5e3e14ee69257108f8112837de913" }
# The denoiser's training loop: `Parameter` holds the weights, `ModuleAdam` steps
# them. The convolutions themselves are ours; see `court::denoise::kpn`.
# Neither is published → tang-tensor 0.1, tang-train 0.1.
tang-tensor  = { git = "https://github.com/ecto/tang", rev = "c9ef210498e5e3e14ee69257108f8112837de913" }
tang-train   = { git = "https://github.com/ecto/tang", rev = "c9ef210498e5e3e14ee69257108f8112837de913" }

# One tang. vcad and phyz both depend on crates.io `tang`; unify them on the same
# git rev this workspace uses, or `tang::Scalar` is two traits across the graph.
# This is not a local-path override (those live in an untracked `.cargo/config.toml`)
# — it is a graph-correctness pin a clean clone needs too. It goes away when tang
# 0.2.1 / tang-la, -ad, -expr 0.1.1 are published with these commits in them.
[patch.crates-io]
tang      = { git = "https://github.com/ecto/tang", rev = "c9ef210498e5e3e14ee69257108f8112837de913" }
tang-la   = { git = "https://github.com/ecto/tang", rev = "c9ef210498e5e3e14ee69257108f8112837de913" }
tang-expr = { git = "https://github.com/ecto/tang", rev = "c9ef210498e5e3e14ee69257108f8112837de913" }
tang-ad   = { git = "https://github.com/ecto/tang", rev = "c9ef210498e5e3e14ee69257108f8112837de913" }

# One phyz, on a clean clone too. This used to be a known gap: ipse-map pinned
# phyz twelve commits behind ours, cargo refuses a `[patch]` whose replacement is
# the same git URL it patches, and so an untouched clone resolved two phyz and
# `Model` split into two types. `crates/kosm-scan` is ipse-map lifted into this
# workspace, ipse is no longer a dependency, and the problem is gone: every phyz
# in the graph is the rev pinned above.


# vcad consumes kosm-render from this repo — now by tag (`kosm-render-v0.2.0`,
# `version = "0.2"`) rather than by rev, as of ecto/vcad#867. That is still a
# back-edge into this workspace: cargo treats the git source and the path member
# as two different packages and builds BOTH unless they are patched together, and
# two kosm-render in one graph means `pathtrace::Scene` from vcad's copy meeting
# `kosm_render::caustics::trace` from ours — E0308 in `kosm/src/brep/mod.rs`.
#
# What the tag changed is that this patch now APPLIES. A `[patch]` may only
# replace a dependency with one that satisfies its requirement; while vcad asked
# for `0.1.0` the local 0.2.0 silently did not, and cargo added the git copy
# beside ours. At `version = "0.2"` on both sides it unifies. Verified with
# `cargo metadata`: exactly one kosm-render, the path one.
#
# It goes away for real when kosm-render is published to crates.io and vcad
# depends on the registry crate.
[patch."https://github.com/ecto/kosm"]
kosm-render = { path = "crates/kosm-render" }
