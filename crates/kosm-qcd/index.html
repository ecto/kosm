<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QCD vacuum — kosm</title>
  <link data-trunk rel="rust" data-bin="kosm-qcd" data-wasm-opt="3" />

    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

      position: absolute; inset: 0; display: grid; place-items: center;
      color: #aaa; font: 15px/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="kosm_qcd"></canvas>
  <div id="loading">starting the lattice…</div>
</body>
