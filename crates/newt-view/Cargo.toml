[package]
name = "newt-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The window: play, scrub and inspect a newt simulation; export is a button"

[dependencies]
newt-spike = { path = "../newt-spike" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
image.workspace = true
phyz-math.workspace = true
tang.workspace = true
anyhow = "1"
log = "0.4"
