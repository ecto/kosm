[package]
name = "kosm-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The window: a wgpu surface, a blitted image, and nothing else on it"

[dependencies]
kosm-spike = { path = "../kosm-spike" }
kosm-render = { path = "../kosm-render", features = ["gpu"] }
# the same wgpu the rest of the workspace is on; winit 0.30 is the one it pairs with
wgpu = "30"
winit = "0.30"
pollster = "0.4"
# the readback: the accumulator comes down as raw f32 and is cast, not parsed
bytemuck = "1"
image.workspace = true
phyz-math.workspace = true
tang.workspace = true
anyhow = "1"
log = "0.4"
# The skatepark's ride viewer (`--ride`, `--live`) is an egui app from main; it
# is behind a feature so the default binary stays the bare viewport.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"], optional = true }
egui = { version = "0.36", optional = true }
ipse-map = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# The GPU tracer runs on the viewport's own device: vcad is on wgpu 30 now,
# so the surface and the path tracer are one set of wgpu types.
vcad-kernel-raytrace = { workspace = true, features = ["gpu"] }
vcad-kernel-gpu = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel-gpu" }
vcad-kernel-math.workspace = true
vcad-kernel.workspace = true
vcad-eval.workspace = true
[features]
default = []
ride = ["dep:eframe", "dep:egui", "dep:ipse-map", "dep:serde", "dep:serde_json"]
