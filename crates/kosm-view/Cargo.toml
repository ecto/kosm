[package]
name = "kosm-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The window: a wgpu surface, a blitted image, and nothing else on it"

[dependencies]
kosm-spike = { path = "../kosm-spike" }
# the same wgpu the rest of the workspace is on; winit 0.30 is the one it pairs with
wgpu = "30"
winit = "0.30"
pollster = "0.4"
# the readback: the accumulator comes down as raw f32 and is cast, not parsed
bytemuck = "1"
image.workspace = true
phyz-math.workspace = true
tang.workspace = true
anyhow = "1"
log = "0.4"
# The GPU tracer runs on the viewport's own device: vcad is on wgpu 30 now,
# so the surface and the path tracer are one set of wgpu types.
vcad-kernel-raytrace = { workspace = true, features = ["gpu"] }
vcad-kernel-gpu = { path = "/Users/cam/Developer/vcad/.claude/worktrees/wgpu-30/crates/vcad-kernel-gpu" }
vcad-kernel-math.workspace = true
vcad-kernel.workspace = true
vcad-eval.workspace = true
