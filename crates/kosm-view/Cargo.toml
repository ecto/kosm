[package]
name = "kosm-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The window: a wgpu surface, a blitted image, and nothing else on it"
repository.workspace = true
# Not publishable until vcad 0.10: this depends on vcad-kernel, -raytrace, -gpu
# and -math, none of which exist on crates.io, and cargo refuses to publish a
# crate with git dependencies. Flip to the default once those are versions.
publish = false

[lib]
name = "kosm_view"
path = "src/lib.rs"

[[bin]]
name = "kosm-view"
path = "src/main.rs"

[dependencies]
kosm-render = { path = "../kosm-render", version = "0.2", features = ["gpu"] }
# the same wgpu the rest of the workspace is on; winit 0.30 is the one it pairs with
wgpu = "30"
winit = "0.30"
pollster = "0.4"
# the readback: the accumulator comes down as raw f32 and is cast, not parsed
bytemuck = "1"
image.workspace = true
phyz-math.workspace = true
tang.workspace = true
anyhow = "1"
log = "0.4"
# egui backs the ride player and the camera/readback a sim's own viewer mode
# shares with it.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36"
kosm-scan = { path = "../kosm-scan", version = "0.0.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# The GPU tracer runs on the viewport's own device: vcad is on wgpu 30 now,
# so the surface and the path tracer are one set of wgpu types.
vcad-kernel-raytrace = { workspace = true, features = ["gpu"] }
vcad-kernel-gpu.workspace = true
vcad-kernel-math.workspace = true
vcad-kernel.workspace = true
[features]
default = []
ride = ["dep:kosm-scan", "dep:serde", "dep:serde_json"]
